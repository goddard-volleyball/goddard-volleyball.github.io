{% component standings() %}
{% set data = load_data(path="processed-standings.csv", format="csv") %}

<div class="row g-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header text-center">Standings</div>
            <div class="card-body d-flex justify-content-center">
                <div class="overflow-auto">
                    <table class="table">
                        <th>
                            <tr>
                                <th>Team</th>
                                <th>Sets Won</th>
                                <th>Sets Lost</th>
                                <th>Win %</th>
                                <th>Games Behind</th>
                            </tr>
                        </th>
                        <tbody>
                        {% for row in data.records %}
                            <tr>
                                {% for value in row %}
                                    <td>{{ value }}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endcomponent %}
